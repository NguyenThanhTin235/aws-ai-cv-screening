name: AI CV Screening Portal CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend — Typecheck & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

  frontend-ci:
    name: Frontend — Typecheck & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Build Production Assets
        run: npm run build

  infra-ci:
    name: Infrastructure — CDK Build & CloudFormation Synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Backend Functions for CDK Assets
        run: |
          cd ../backend
          npm ci
          npm run build
          cd ../infra

      - name: Build TypeScript Stacks
        run: npm run build

      - name: Validate CloudFormation Synthesis (cdk synth)
        run: npx cdk synth
        env:
          STAGE: dev
          AWS_REGION: us-east-1

  ci-status:
    name: CI Pipeline Status Check
    needs: [ backend-ci, frontend-ci, infra-ci ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate Job Results
        run: |
          if [ "${{ needs.backend-ci.result }}" != "success" ] || \
             [ "${{ needs.frontend-ci.result }}" != "success" ] || \
             [ "${{ needs.infra-ci.result }}" != "success" ]; then
            echo "CI Pipeline failed in one or more jobs!"
            exit 1
          fi
          echo "All CI jobs passed successfully!"

